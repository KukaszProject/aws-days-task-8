name: Deploy Lambdas
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Zip and Deploy CreateOrder
        run: |
          cd lambdas
          zip -r createOrder.zip cmtr_ac643e5v_lambda_createOrder/
          aws lambda update-function-code --function-name cmtr_ac643e5v_lambda_createOrder --zip-file fileb://createOrder.zip

      - name: Zip and Deploy ReserveStock
        run: |
          cd lambdas
          zip -r reserveStock.zip cmtr_ac643e5v_lambda_reserveStock/
          aws lambda update-function-code --function-name cmtr_ac643e5v_lambda_reserveStock --zip-file fileb://reserveStock.zip

      - name: Zip and Deploy SendNotification
        run: |
          cd lambdas
          zip -r sendNotification.zip cmtr_ac643e5v_lambda_sendNotification/
          aws lambda update-function-code --function-name cmtr_ac643e5v_lambda_sendNotification --zip-file fileb://sendNotification.zip